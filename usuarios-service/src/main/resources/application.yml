server:
  port: 8081

spring:
  application:
    name: usuarios-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/usuarios}
    username: ${DB_USUARIO:postgres}
    password: ${DB_CONTRASENA:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

jwt:
  secreto: ${JWT_SECRETO}
  duracion: 8h

sesion:
  cookie-segura: ${COOKIE_SEGURA:true}

admin:
  email: ${ADMIN_EMAIL}
  contrasena: ${ADMIN_CONTRASENA}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

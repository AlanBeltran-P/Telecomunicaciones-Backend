server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: usuarios
              uri: lb://usuarios-service
              predicates:
                - Path=/api/auth/**
            - id: catalogo
              uri: lb://catalogo-service
              predicates:
                - Path=/api/planes/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    # Registrarse con la IP: el hostname de la máquina puede no resolverse por DNS
    prefer-ip-address: true

# El mismo secreto en todos los servicios (al menos 32 caracteres)
jwt:
  secreto: ${JWT_SECRETO}

spring:
  web:
    # Idioma de los mensajes si el pedido no trae Accept-Language (o trae uno que no soportamos)
    locale: es
  messages:
    # Sin esto, en un servidor en inglés se usaría messages_en en lugar del español por defecto
    fallback-to-system-locale: false
  datasource:
    username: ${DB_USUARIO:postgres}
    password: ${DB_CONTRASENA:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: usuarios
              uri: lb://usuarios-service
              predicates:
                - Path=/api/auth/**,/api/usuarios/**,/api/clientes/**
            - id: catalogo
              uri: lb://catalogo-service
              predicates:
                - Path=/api/planes/**
            - id: contrataciones
              uri: lb://contrataciones-service
              predicates:
                - Path=/api/contrataciones/**

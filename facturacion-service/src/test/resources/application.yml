spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:facturacion;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: create-drop

jwt:
  secreto: secreto-de-prueba-de-al-menos-32-caracteres

facturacion:
  dias-para-vencer: 10
  # "-" desactiva el proceso programado durante los tests
  cron: "-"

eureka:
  client:
    enabled: false
